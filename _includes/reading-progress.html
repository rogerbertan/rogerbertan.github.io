<!-- Barra de progresso de leitura, fixa no topo da viewport. -->

<div id="reading-progress-bar" role="presentation" aria-hidden="true"></div>

<script>
  (function () {
    function init() {
      var bar = document.getElementById('reading-progress-bar');
      if (!bar) return;

      /* O tema aplica `#tail-wrapper > :not(script) { margin-top: 3rem }`, e
         esse include e renderizado dentro do #tail-wrapper. Em elemento fixed
         a margem desloca a caixa depois do top, entao a barra nascia 48px
         abaixo do topo. Promover para filho direto do body tira a barra do
         alcance daquele seletor, que e o lugar de uma camada fixa de qualquer
         forma: o gem nao expoe hook fora do footer para escrever o markup ja
         no lugar certo. */
      if (bar.parentNode !== document.body) {
        document.body.appendChild(bar);
      }

      function updateProgress() {
        var scrollTop = window.scrollY || document.documentElement.scrollTop;
        var scrollHeight =
          document.documentElement.scrollHeight -
          document.documentElement.clientHeight;
        var percent =
          scrollHeight > 0 ? Math.min(100, (scrollTop / scrollHeight) * 100) : 0;
        bar.style.width = percent + '%';
      }

      window.addEventListener('scroll', updateProgress, { passive: true });
      window.addEventListener('resize', updateProgress);
      updateProgress();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
